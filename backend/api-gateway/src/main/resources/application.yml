#spring.application.name=api-gateway

#Application constants
server:
  port: ${API_GATEWAY_PORT:9090}
  address: ${API_GATEWAY_BIND_ADDRESS:127.0.0.1}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never


jwt:
  secret: ${JWT_SECRET}


spring:
  application:
    name: api-gateway

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:3000}
                allowedMethods:
                  - GET
                  - POST
                  - DELETE
                  - PUT
                  - OPTIONS
                  - PATCH
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Accept-Language
                  - X-Correlation-Id
                  - Idempotency-Key
                exposedHeaders:
                  - X-Correlation-Id
                allowCredentials: true
                maxAge: 3600
          routes:

            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**

            - id: route-service
              uri: lb://route-service
              predicates:
                - Path=/api/routes/**
              filters:
                - name: JwtAuthFilter

            - id: ticket-service
              uri: lb://ticket-service
              predicates:
                - Path=/api/tickets/**
              filters:
                - name: JwtAuthFilter

            - id: vehicle-service
              uri: lb://vehicle-service
              predicates:
                - Path=/api/vehicles/**
              filters:
                - name: JwtAuthFilter

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
              filters:
                - name: JwtAuthFilter

            - id: analytics-service
              uri: lb://analytics-service
              predicates:
                - Path=/api/analytics/**
              filters:
                - name: JwtAuthFilter


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}



# Logging Config


logging:
  level:
    root: INFO
    com.transport.apigateway: INFO
    org.springframework.cloud.gateway: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} -%msg%n"



gateway:
  secret-key: ${GATEWAY_SHARED_SECRET}
